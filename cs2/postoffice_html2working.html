    //checks the values & assigns a number to it
    function size_tracker(l, h, w) {
        let size_tracked = 0
        console.log("sizetracker running!")
        console.log(l, h, w)
        
        if ((3.5 <= l && l <= 4.25) && (3.5 <= h && h <= 6) && (.007 <= w && w <= .016)) {
            size_tracked = 1;
        }
        else if ((4.25 <= l && l <= 6) && (6 <= h && h <= 11.5) && (.007 <= w && w <= .016)) {
            size_tracked = 2;
        }
        else if ((3.5 <= l && l <= 6.125) && (5 <= h && h <= 11.5) && (.016 <= w && w <= .25)){
            size_tracked = 3;
        }
        else if ((6.125 <= l && l <= 24) && (11 <= h && h <= 18) && (.25 <= w && w <= .5)){
            size_tracked = 4;
        }
        else if ((l + 2*w +2*h) <= 86){
            size_tracked = 5;
        }
        else if ((l + 2*w +2*h) <= 130) {
            size_tracked = 6;
        }
        else {
            size_tracked = 0;
        }
        return(size_tracked)
        }



    //returns a zone value from a zip value
    function zone_counter(zip) {
        if (1 <= zip && zip <= 6999){
            return 1
        }
        else if (zip && zip <= 19999){
            return 2
        }
        else if (zip && zip <= 35999){
            return 3
        }
        else if (zip && zip <= 62999){
            return 4
        }
        else if (zip && zip <= 84999){
            return 5
        }
        else if (zip && zip <= 99999){
            return 6}
        else{
            return 0
        }
        }
        
    //takes in dimensions && zone different && returns a monetary value
    function money(dm, zd) {
        const parcel_price = [0, .2, .37, .37, .6, 2.95, 3.95];
        const zone_price = [0, .03, .03, .04, .05, .25, .35];
        let price = parcel_price[dm] + (zone_price[dm]*zd); //fix maybe
        return price
    }
