<!DOCTYPE html>
<html>
<head>
<script>



    //checks the values & assigns a number to it
    function size_tracker(l, h, w) {
        let size_tracked = 0
        switch (l, h, w) {
        case (3.5 <= l <= 4.25) && (3.5 <= h <= 6) && (.007 <= w <= .016):
            size_tracked = 1;
            break;
        case (4.25 <= l <= 6) && (6 <= h <= 11.5) && (.007 <= w <= .016):
            size_tracked = 2;
            break;
        case (3.5 <= l <= 6.125) && (5 <= h <= 11.5) && (.016 <= w <= .25):
            size_tracked = 3;
            break;
        case (6.125 <= l <= 24) && (11 <= h <= 18) && (.25 <= w <= .5):
            size_tracked = 4;
            break;
        case (l + 2*w +2*h) <= 86:
            size_tracked = 5;
            break;
        case (l + 2*w +2*h) <= 130:
            size_tracked = 6;
            break;
        default:
            size_tracked = 0;
        return(size_tracked)
        }}


    //attempts data conversion && if not returns empty values
    function data_conversion(l, h, w, zip1, zip2) {
        try {
            return(Number(l), Number(w), Number(h), Number(zip1), Number(zip2));
        } catch(err) {
            return 0, 0, 0, 0, 0
        }}

    //returns a zone value from a zip value
    function zone_counter(zip) {
        switch(zip) {
        case 1 <= zip <= 6999:
            return 1
        case zip <= 19999:
            return 2
        case zip <= 35999:
            return 3
        case zip <= 62999:
            return 4
        case zip <= 84999:
            return 5
        case zip <= 99999:
            return 6
        default:
            return 0
        }}
        
    //takes in dimensions && zone different && returns a monetary value
    function money(dm, zd) {
        const parcel_price = [0, .2, .37, .37, .6, 2.95, 3.95];
        const zone_price = [0, .03, .03, .04, .05, .25, .35];
        let price = parcel_price[dm] + (zone_price[dm]*zd); //fix maybe
        return price
    }
    //main function
    function main() {
        while (true) {
            //sets variables based on inputs
            document.getElementById("result").innerText = "Input does not conform to possible values";
            let l = document.getElementById("length").value;
            let h = document.getElementById("height").value;
            let w = document.getElementById("width").value;
            let zip1 = document.getElementById("zip1").value;
            let zip2 = document.getElementById("zip2").value;


            //removes any extra zeroes - put off for now
            //for i in range(len(data_list)):
            //    data_list[i] = data_list[i].strip()
            
            //converts the variables into their proper data classes
            
            /*l = data_conversion[0]
            h = data_conversion[1]
            w = data_conversion[2]
            zip1 = data_conversion[3]
            zip2 = data_conversion[4]*/


            //checks to see if the try accept failed or if the parcel does not conform to the packages list

            size_value = size_tracker(l, w, h)
            if ([l, h, w, zip1, zip2, size_value].includes(false)) {
                document.getElementById("result").innerText = "Input does not conform to possible values";
                continue
            }
            //converts zip codes into zones
            let zone1 = zone_counter(zip1);
            let zone2 = zone_counter(zip2);

            //variable that is prepping to format correctly- 
            //size trakcer takes the dimensions && returns a value representing the parcel size
            //takes the positive difference of the zones with absolute value
            //money function takes the 2 values && turns it into a value
            //then turns it into a float        
            correct_money = (money(size_value, Math.abs(zone1 - zone2)));

            //formats the float with 2 decimal points
            //correct_money = f"{correct_money:.2f}";
            //removes the first zero
            //correct_money = correct_money.lstrip("0")

            document.getElementById("result").innerText = correct_money;
            

    }}


</script>
</head>
<body>
<h1>Please input your dimensions and your origin zipcode and your destination zipcode</h1>
 

<label for="length">Enter Length (longest side in inches)</label><br>
<input type="number" id="length" name="length"><br><br>

<input type="number" id="height" name="height"><br><br>
<label for="zip1">Enter origin zipcode</label><br>
<input type="number" id="zip1" name="zip1"><br><br>
<label for="zip2">Enter destination zipcode</label><br>
<input type="number" id="zip2" name="zip2"><br><br><br>



<!-- Button that calls the function (directly taken from Mr. Campbells sample code)-->

<p id="result"></p>
</form>
</body>
</html>
