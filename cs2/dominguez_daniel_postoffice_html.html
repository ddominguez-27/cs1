<script>
    /*Flower Pot:

    /*
    Description: checks the dimension values & assigns a number to it
    Args: l, h, w (all floats)
    Returns: size_tracked (int) 
    */
    function size_tracker(l, h, w) {
        let size_tracked = 0
        console.log("sizetracker running!")
        console.log(l, h, w)
        
        if ((3.5 <= l && l <= 4.25) && (3.5 <= h && h <= 6) && (.007 <= w && w <= .016)) {
            size_tracked = 1;
        }
        else if ((4.25 <= l && l <= 6) && (6 <= h && h <= 11.5) && (.007 <= w && w <= .016)) {
            size_tracked = 2;
        }
        else if ((3.5 <= l && l <= 6.125) && (5 <= h && h <= 11.5) && (.016 <= w && w <= .25)){
            size_tracked = 3;
        }
        else if ((6.125 <= l && l <= 24) && (11 <= h && h <= 18) && (.25 <= w && w <= .5)){
            size_tracked = 4;
        }
        else if ((l + 2*w +2*h) <= 86){
            size_tracked = 5;
        }
        else if ((l + 2*w +2*h) <= 130) {
            size_tracked = 6;
        }
        else {
            size_tracked = 0;
        }
        return(size_tracked)
        }



    /*
    Description: returns a zone value from a zip value
    Args: zip (int)
    Description: int (0-6)
    */
    function zone_counter(zip) {
        if (1 <= zip && zip <= 6999){
            return 1
        }
        else if (zip && zip <= 19999){
            return 2
        }
        else if (zip && zip <= 35999){
            return 3
        }
        else if (zip && zip <= 62999){
            return 4
        }
        else if (zip && zip <= 84999){
            return 5
        }
        else if (zip && zip <= 99999){
            return 6}
        else{
            return 0
        }
        }
        
    /*
    Description: takes in dimensions && zone different && returns a monetary value
    Args: dm (int), zd (int)
    Returns price (number/float)
    */
    function money(dm, zd) {
        const parcel_price = [0, .2, .37, .37, .6, 2.95, 3.95];
        const zone_price = [0, .03, .03, .04, .05, .25, .35];
        let price = parcel_price[dm] + (zone_price[dm]*zd); 
        return price
    }


    //main function
    //no args or returns
    function main() {
        console.log("Hello, world!");
    
        //sets variables based on inputs
        document.getElementById("result").innerText = "Input does not conform to possible values";
        let l = parseFloat(document.getElementById("length").value);
        let h = parseFloat(document.getElementById("height").value);
        let w = parseFloat(document.getElementById("width").value);
        let zip1 = parseInt(document.getElementById("zip1").value);
        let zip2 = parseInt(document.getElementById("zip2").value);
        





        //converts zip codes into zones
        let zone1 = zone_counter(zip1);
        let zone2 = zone_counter(zip2);


        //checks to see which packages are unmailable based on the values
        let size_value = size_tracker(l, w, h)
        console.log(size_value)
        if ([l, h, w, zip1, zip2, size_value, zone1, zone2].includes(0)) {
            document.getElementById("result").innerText = "Input does not conform to possible values";
        }
        else {


        //variable that is prepping to format correctly- 
        //takes the positive difference of the zones with absolute value
        //money function takes the 2 values && turns it into a value 
        //formats the float with 2 decimal points
        let correct_money = money(size_value, Math.abs(zone1 - zone2)).toFixed(2);
        //removes leading zeros
        correct_money = correct_money.replace(/^0+/, '');



        document.getElementById("result").innerText = correct_money;
        }
            

    }


</script>
